spring.application.name=flight-operations
server.port=${PORT:8081}
app.instance-id=${INSTANCE_ID:fo-1}
app.peers=${PEERS:}

app.services.routes.urls=${ROUTES_URLS:http://localhost:8091,http://localhost:8092}
app.services.routes.path=/api/routes/{id}
app.services.aircraft.urls=${AIRCRAFT_URLS:http://localhost:8071,http://localhost:8072}
app.services.aircraft.path=/api/aircraft/{registration}

app.http.connect-timeout=1s
app.http.read-timeout=2s
app.http.max-attempts=2
app.http.initial-backoff=200ms

app.security.api-key=${API_KEY:sidis-dev-key}
app.scheduling.min-gap-hours=2

spring.datasource.url=jdbc:h2:mem:flightops_${app.instance-id};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id}] %-5level %logger{28} - %msg%n
logging.level.pt.isep.psoft.aisafe=DEBUG