spring.application.name=flight-operations
server.port=${PORT:8081}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:aisafe-key}
app.instance-id=${INSTANCE_ID:fo-1}
app.peers=${PEERS:}

app.services.routes.urls=${ROUTES_URLS:https://localhost:8091,https://localhost:8092,https://localhost:8093}
app.services.routes.path=/api/routes/{id}
app.services.aircraft.urls=${AIRCRAFT_URLS:https://localhost:8071,https://localhost:8072,https://localhost:8073}
app.services.aircraft.path=/api/aircraft/{registration}

app.http.connect-timeout=1s
app.http.read-timeout=2s
app.http.max-attempts=2
app.http.initial-backoff=200ms
app.http.peer-threads=8

app.http.circuit-breaker.failure-threshold=3
app.http.circuit-breaker.open-duration=10s

app.security.api-key=${API_KEY:sidis-dev-key}
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/aisafe/protocol/openid-connect/certs}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8180/realms/aisafe}
app.security.jwt.accept-dev-tokens=${ACCEPT_DEV_TOKENS:true}
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-bytes}

app.scheduling.min-gap-hours=2
app.scheduling.require-complete-conflict-check=${REQUIRE_COMPLETE_CONFLICT_CHECK:false}
app.replication.enabled=${REPLICATION_ENABLED:true}
app.replication.retry-interval=5s

# ---- Database-per-Service: one PostgreSQL per replica (schemas fo_command + fo_query) ----
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5441/flightops}
spring.datasource.username=${DB_USER:flightops}
spring.datasource.password=${DB_PASSWORD:flightops}
spring.datasource.hikari.connection-timeout=5000
spring.flyway.schemas=fo_command,fo_query
spring.flyway.default-schema=fo_command
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.h2.console.enabled=false

# ---- RabbitMQ cluster (AMQP) ----
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aisafe}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aisafe-mq}
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
spring.rabbitmq.connection-timeout=5s
spring.rabbitmq.requested-heartbeat=10s
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=20
app.messaging.airports-exchange=airports.events
spring.rabbitmq.ssl.verify-hostname=true
spring.rabbitmq.address-shuffle-mode=random

# ---- Transactional outbox ----
app.outbox.poll-interval=500ms
app.outbox.batch-size=100
app.outbox.confirm-timeout=5s
app.outbox.max-backoff=30s
app.outbox.retention=7d
app.outbox.cleanup-interval=1h
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
management.health.rabbit.enabled=false
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id}] %-5level %logger{28} - %msg%n
logging.level.pt.isep.psoft.aisafe=DEBUG
app.mood.refresh-interval=5m

