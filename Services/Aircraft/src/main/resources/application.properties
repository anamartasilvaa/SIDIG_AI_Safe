spring.application.name=aircraft
server.port=${PORT:8071}
server.ssl.enabled=${SSL_ENABLED:false}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:changeit}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:aisafe-key}
app.instance-id=${INSTANCE_ID:aircraft-1}
app.peers=${PEERS:}
app.services.flights.urls=${FLIGHTS_URLS:http://localhost:8081,http://localhost:8082}
app.services.flights.in-flight-path=${FLIGHTS_IN_FLIGHT_PATH:/internal/scheduled-flights/aircraft/{registration}}
app.services.flights.grounding-path=${FLIGHTS_GROUNDING_PATH:/api/scheduled-flights/aircraft/{registration}/grounding}
app.services.routes.urls=${ROUTES_URLS:http://localhost:8091,http://localhost:8092}
app.services.routes.path=${ROUTES_PATH:/api/routes}
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:1s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:2s}
app.http.max-attempts=${HTTP_MAX_ATTEMPTS:2}
app.http.initial-backoff=${HTTP_INITIAL_BACKOFF:200ms}
app.http.peer-threads=${HTTP_PEER_THREADS:8}
app.http.circuit-breaker.failure-threshold=${HTTP_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
app.http.circuit-breaker.open-duration=${HTTP_CIRCUIT_BREAKER_OPEN_DURATION:10s}
app.replication.enabled=${REPLICATION_ENABLED:true}
app.replication.retry-interval=${REPLICATION_RETRY_INTERVAL:5s}
app.security.api-key=${API_KEY:sidis-dev-key}
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-bytes}
spring.datasource.url=jdbc:h2:mem:aircraft_${app.instance-id};DB_CLOSE_DELAY=-1
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id}] %-5level %logger{28} - %msg%n
logging.level.pt.isep.psoft.aisafe=DEBUG
