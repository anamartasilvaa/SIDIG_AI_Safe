spring.application.name=aircraft
server.port=${PORT:8071}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:aisafe-key}
app.instance-id=${INSTANCE_ID:aircraft-1}
app.peers=${PEERS:}
app.services.flights.urls=${FLIGHTS_URLS:https://localhost:8081,https://localhost:8082,https://localhost:8083}
app.services.flights.in-flight-path=${FLIGHTS_IN_FLIGHT_PATH:/internal/scheduled-flights/aircraft/{registration}}
app.services.flights.grounding-path=${FLIGHTS_GROUNDING_PATH:/internal/scheduled-flights/aircraft/{registration}/grounding}
app.services.routes.urls=${ROUTES_URLS:http://localhost:8091,http://localhost:8092}
app.services.routes.path=${ROUTES_PATH:/api/routes}
app.http.connect-timeout=${HTTP_CONNECT_TIMEOUT:1s}
app.http.read-timeout=${HTTP_READ_TIMEOUT:2s}
app.http.max-attempts=${HTTP_MAX_ATTEMPTS:2}
app.http.initial-backoff=${HTTP_INITIAL_BACKOFF:200ms}
app.http.peer-threads=${HTTP_PEER_THREADS:8}
app.http.circuit-breaker.failure-threshold=${HTTP_CIRCUIT_BREAKER_FAILURE_THRESHOLD:3}
app.http.circuit-breaker.open-duration=${HTTP_CIRCUIT_BREAKER_OPEN_DURATION:10s}
app.replication.enabled=${REPLICATION_ENABLED:true}
app.replication.retry-interval=${REPLICATION_RETRY_INTERVAL:5s}
app.security.api-key=${API_KEY:sidis-dev-key}
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-bytes}
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/aisafe/protocol/openid-connect/certs}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8180/realms/aisafe}
app.security.jwt.accept-dev-tokens=${ACCEPT_DEV_TOKENS:true}
spring.datasource.url=${DB_URL:jdbc:h2:mem:aircraft_${app.instance-id};DB_CLOSE_DELAY=-1}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=${DDL_AUTO:create-drop}
spring.jpa.open-in-view=false
spring.h2.console.enabled=true

# AMQP / database-per-replica
spring.rabbitmq.addresses=${RABBITMQ_ADDRESSES:localhost:5672}
spring.rabbitmq.username=${RABBITMQ_USER:aisafe}
spring.rabbitmq.password=${RABBITMQ_PASSWORD:aisafe-mq}
spring.rabbitmq.publisher-confirm-type=correlated
spring.rabbitmq.publisher-returns=true
spring.rabbitmq.template.mandatory=true
spring.rabbitmq.listener.simple.prefetch=20
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.ssl.enabled=${RABBITMQ_SSL:false}
app.messaging.aircraft-exchange=aircraft.events
app.messaging.maintenance-exchange=maintenance.events
app.messaging.flights-exchange=flights.events
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
logging.pattern.console=%d{HH:mm:ss.SSS} [${app.instance-id}] %-5level %logger{28} - %msg%n
logging.level.pt.isep.psoft.aisafe=DEBUG
