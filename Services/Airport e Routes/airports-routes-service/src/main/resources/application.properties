spring.application.name=airports-routes-service

server.port=8091
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-password=${KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=aisafe-key

peer.urls=https://localhost:8092,https://localhost:8093
# Entrega 2: leituras so do modelo de leitura local (sem pedidos HTTP entre instancias).
# Por omissao 0; pode voltar a 1 para reativar o reencaminhamento P2P da Entrega 1.
peer.forwarding.max-hops=${PEER_FORWARDING_MAX_HOPS:0}
# Instancia que arranca com a BD vazia copia os dados de outra instancia (GET /internal/snapshot).
app.snapshot.enabled=${APP_SNAPSHOT_ENABLED:true}
app.snapshot.retry-interval=5s
peer.http.connect-timeout=2000
peer.http.read-timeout=3000
peer.resilience.failure-threshold=3
peer.resilience.open-duration=10s
peer.resilience.max-retries=1
peer.resilience.retry-backoff=100ms

spring.datasource.url=jdbc:h2:file:./data/airports_db_1;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Se a BD desta instancia estiver em baixo, desiste ao fim de 2 s e responde 503 (a gateway repete na outra instancia).
spring.datasource.hikari.connection-timeout=2000
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# Esquema gerido pelo Flyway (src/main/resources/db/migration); o Hibernate nao o altera.
spring.jpa.hibernate.ddl-auto=none
spring.flyway.locations=classpath:db/migration
spring.h2.console.enabled=true

app.storage.upload-dir=./uploads
app.storage.public-base-url=

jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-bytes}
app.security.jwt.jwk-set-uri=http://localhost:8180/realms/aisafe/protocol/openid-connect/certs
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8180/realms/aisafe}
app.security.jwt.accept-dev-tokens=true

# Mensageria (RabbitMQ). Modo A: broker em localhost:5672 com guest/guest (valores por omissao do Spring).
# Modo B (Docker): o docker-compose define SPRING_RABBITMQ_HOST/USERNAME/PASSWORD.
app.messaging.exchange=airports.events

# Replicacao entre instancias: "amqp" (RabbitMQ, fanout) ou "http" (entrega direta a cada peer).
app.replication.transport=amqp
spring.rabbitmq.publisher-confirm-type=simple
spring.rabbitmq.listener.simple.default-requeue-rejected=false
spring.rabbitmq.listener.simple.retry.enabled=true
spring.rabbitmq.listener.simple.retry.initial-interval=1s
spring.rabbitmq.listener.simple.retry.multiplier=2
app.messaging.queue.ttl-ms=3600000
app.messaging.queue.max-length=10000
