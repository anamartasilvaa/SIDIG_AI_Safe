spring.application.name=airports-routes-service

server.port=${PORT:8091}
server.ssl.enabled=${SSL_ENABLED:true}
server.ssl.key-store=${SSL_KEYSTORE:classpath:keystore.p12}
server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD:password}
server.ssl.key-store-type=PKCS12
server.ssl.key-alias=${SSL_KEY_ALIAS:aisafe-key}

peer.urls=${PEERS:}
peer.forwarding.max-hops=${PEER_FORWARDING_MAX_HOPS:1}
peer.http.connect-timeout=${PEER_HTTP_CONNECT_TIMEOUT:2000}
peer.http.read-timeout=${PEER_HTTP_READ_TIMEOUT:3000}
spring.datasource.url=jdbc:h2:mem:${DB_NAME:airports_routes_db};DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=always
jwt.secret=${JWT_SECRET:change-this-development-secret-key-with-at-least-32-bytes}
app.security.jwt.jwk-set-uri=${JWT_JWK_SET_URI:http://localhost:8180/realms/aisafe/protocol/openid-connect/certs}
app.security.jwt.issuer=${JWT_ISSUER:http://localhost:8180/realms/aisafe}
app.security.jwt.accept-dev-tokens=${ACCEPT_DEV_TOKENS:true}
