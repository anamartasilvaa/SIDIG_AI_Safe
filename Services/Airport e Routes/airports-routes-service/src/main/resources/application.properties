spring.application.name=airports-routes-service

server.port=8091
peer.urls=${peer.url:http://localhost:8092}
peer.forwarding.max-hops=1
peer.http.connect-timeout=2000
peer.http.read-timeout=3000
spring.datasource.url=jdbc:h2:mem:airports_routes_db;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.h2.console.enabled=true
jwt.secret=change-this-development-secret-key-with-at-least-32-bytes