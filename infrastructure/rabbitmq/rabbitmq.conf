# RabbitMQ cluster: 3 nodes, quorum queues, AMQP only over TLS (AMQPS).

# ---- Cluster formation (static list of the 3 nodes) ----
cluster_formation.peer_discovery_backend = classic_config
cluster_formation.classic_config.nodes.1 = rabbit@rabbitmq-1
cluster_formation.classic_config.nodes.2 = rabbit@rabbitmq-2
cluster_formation.classic_config.nodes.3 = rabbit@rabbitmq-3

# A node isolated in a minority (network partition) pauses itself instead of
# diverging; the majority (2 of 3) keeps serving. Quorum queues use Raft anyway.
cluster_partition_handling = pause_minority

# ---- Clients: AMQPS only (port 5671); plain AMQP (5672) is disabled ----
listeners.tcp = none
listeners.ssl.default = 5671
ssl_options.cacertfile = /etc/rabbitmq/certs/aisafe.pem
ssl_options.certfile   = /etc/rabbitmq/certs/aisafe.pem
ssl_options.keyfile    = /etc/rabbitmq/certs/aisafe.key
# Clients authenticate with user/password (SASL PLAIN inside TLS), not with certificates.
ssl_options.verify               = verify_none
ssl_options.fail_if_no_peer_cert = false
ssl_options.versions.1 = tlsv1.3
ssl_options.versions.2 = tlsv1.2

# ---- Management UI / HTTP API (internal network; console published only on 127.0.0.1) ----
management.tcp.port = 15672
