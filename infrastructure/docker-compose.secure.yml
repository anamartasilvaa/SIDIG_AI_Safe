name: aisafe

x-service: &service
  restart: unless-stopped
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:

    - ./docker/certs/keystore.p12:/certs/keystore.p12:ro
    - ./docker/certs/truststore.p12:/certs/truststore.p12:ro
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8443/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-service-env: &service-env
  PORT: "8443"
  SSL_ENABLED: "true"
  SSL_KEYSTORE: file:/certs/keystore.p12
  SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?defina KEYSTORE_PASSWORD no .env (corra docker/gen-certs.ps1)}
  SSL_KEY_ALIAS: aisafe-key

  JAVA_TOOL_OPTIONS: >-
    -Djavax.net.ssl.trustStore=/certs/truststore.p12
    -Djavax.net.ssl.trustStorePassword=${KEYSTORE_PASSWORD}
    -Djavax.net.ssl.trustStoreType=PKCS12
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (corra docker/gen-certs.ps1)}
  JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
  JWT_ISSUER: http://localhost:8180/realms/aisafe

x-keycloak-env: &keycloak-env
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://keycloak-db:5432/keycloak
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: ${KC_DB_PASSWORD:?defina KC_DB_PASSWORD no .env}

  KC_HOSTNAME: http://localhost:8180
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8180"
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?defina KC_ADMIN_PASSWORD no .env}

x-gateway: &gateway
  image: nginx:1.27-alpine
  restart: unless-stopped
  networks: [edge, backend]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./docker/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    - ./docker/certs/aisafe.pem:/etc/nginx/certs/aisafe.pem:ro
    - ./docker/certs/aisafe.key:/etc/nginx/certs/aisafe.key:ro
  depends_on:
    keycloak-1: {condition: service_started}
    keycloak-2: {condition: service_started}
    aircraft-1: {condition: service_healthy}
    aircraft-2: {condition: service_healthy}
    maintenance-1: {condition: service_healthy}
    maintenance-2: {condition: service_healthy}
    airports-routes-1: {condition: service_healthy}
    airports-routes-2: {condition: service_healthy}
    flight-operations-1: {condition: service_healthy}
    flight-operations-2: {condition: service_healthy}

services:

  keycloak-db:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: keycloak
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: ${KC_DB_PASSWORD:?defina KC_DB_PASSWORD no .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U keycloak -d keycloak"]
      interval: 5s
      timeout: 5s
      retries: 20

  keycloak-1:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start", "--import-realm"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment: *keycloak-env
    networks:
      backend:
        aliases: [keycloak]
    volumes:
      - ./keycloak/aisafe-realm.json:/opt/keycloak/data/import/aisafe-realm.json:ro
    depends_on:
      keycloak-db: {condition: service_healthy}

  keycloak-2:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment: *keycloak-env
    networks:
      backend:
        aliases: [keycloak]
    depends_on:
      keycloak-db: {condition: service_healthy}
      keycloak-1: {condition: service_started}

  # ------------------------- Aircraft -------------------------
  aircraft-1:
    <<: *service
    build:
      context: ../Services/Aircraft
    environment:
      <<: *service-env
      INSTANCE_ID: aircraft-1
      PEERS: https://aircraft-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      FLIGHTS_URLS: https://flight-operations-1:8443,https://flight-operations-2:8443
      FLIGHTS_GROUNDING_PATH: "/internal/scheduled-flights/aircraft/{registration}/grounding"
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443

  aircraft-2:
    <<: *service
    build:
      context: ../Services/Aircraft
    environment:
      <<: *service-env
      INSTANCE_ID: aircraft-2
      PEERS: https://aircraft-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      FLIGHTS_URLS: https://flight-operations-1:8443,https://flight-operations-2:8443
      FLIGHTS_GROUNDING_PATH: "/internal/scheduled-flights/aircraft/{registration}/grounding"
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443

  # ------------------------- Maintenance -------------------------
  maintenance-1:
    <<: *service
    build:
      context: ../Services/Maintenance
    environment:
      <<: *service-env
      INSTANCE_ID: maintenance-1
      PEERS: https://maintenance-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}

  maintenance-2:
    <<: *service
    build:
      context: ../Services/Maintenance
    environment:
      <<: *service-env
      INSTANCE_ID: maintenance-2
      PEERS: https://maintenance-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}

  # ------------------------- Airports & Routes -------------------------

  airports-routes-1:
    <<: *service
    build:
      context: ../Services/Airport e Routes/airports-routes-service
    environment:
      <<: *service-env
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
      SERVER_SSL_KEY_ALIAS: aisafe-key
      PEER_URLS: https://airports-routes-2:8443
      PEER_NODE_ID: airports-routes-1
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: http://localhost:8180/realms/aisafe
      APP_SECURITY_JWT_ACCEPT_DEV_TOKENS: "true"
    healthcheck:
      test: ["CMD", "curl", "--silent", "--insecure", "--output", "/dev/null", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  airports-routes-2:
    <<: *service
    build:
      context: ../Services/Airport e Routes/airports-routes-service
    environment:
      <<: *service-env

      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
      SERVER_SSL_KEY_ALIAS: aisafe-key
      PEER_URLS: https://airports-routes-1:8443
      PEER_NODE_ID: airports-routes-2
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: http://localhost:8180/realms/aisafe
      APP_SECURITY_JWT_ACCEPT_DEV_TOKENS: "true"

    healthcheck:
      test: ["CMD", "curl", "--silent", "--insecure", "--output", "/dev/null", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ------------------------- Flight Operations -------------------------
  flight-operations-1:
    <<: *service
    build:
      context: ../Services/Flighting Operations
    environment:
      <<: *service-env
      INSTANCE_ID: flight-operations-1
      PEERS: https://flight-operations-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}
      airports-routes-1: {condition: service_healthy}
      airports-routes-2: {condition: service_healthy}

  flight-operations-2:
    <<: *service
    build:
      context: ../Services/Flighting Operations
    environment:
      <<: *service-env
      INSTANCE_ID: flight-operations-2
      PEERS: https://flight-operations-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}
      airports-routes-1: {condition: service_healthy}
      airports-routes-2: {condition: service_healthy}

  # ------------------------- API Gateways (2 instancias identicas) -------------------------
  gateway-1:
    <<: *gateway
    ports:
      - "8443:8443"

  gateway-2:
    <<: *gateway
    ports:
      - "8444:8443"

networks:
  edge: {}
  backend:
    internal: true