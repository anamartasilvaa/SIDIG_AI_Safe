name: aisafe

x-service: &service
  restart: unless-stopped
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]
  volumes:

    - ./docker/certs/keystore.p12:/certs/keystore.p12:ro
    - ./docker/certs/truststore.p12:/certs/truststore.p12:ro
  healthcheck:
    test: ["CMD", "curl", "--fail", "--silent", "--insecure", "https://localhost:8443/actuator/health"]
    interval: 10s
    timeout: 5s
    retries: 12
    start_period: 40s

x-service-env: &service-env
  PORT: "8443"
  SSL_ENABLED: "true"
  SSL_KEYSTORE: file:/certs/keystore.p12
  SSL_KEYSTORE_PASSWORD: ${KEYSTORE_PASSWORD:?defina KEYSTORE_PASSWORD no .env (corra docker/gen-certs.ps1)}
  SSL_KEY_ALIAS: aisafe-key

  JAVA_TOOL_OPTIONS: >-
    -Djavax.net.ssl.trustStore=/certs/truststore.p12
    -Djavax.net.ssl.trustStorePassword=${KEYSTORE_PASSWORD}
    -Djavax.net.ssl.trustStoreType=PKCS12
  JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET no .env (corra docker/gen-certs.ps1)}
  JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
  JWT_ISSUER: http://localhost:8180/realms/aisafe

x-keycloak-env: &keycloak-env
  KC_DB: postgres
  KC_DB_URL: jdbc:postgresql://keycloak-db-0:5432,keycloak-db-1:5432,keycloak-db-2:5432/keycloak?targetServerType=primary&connectTimeout=5
  KC_DB_USERNAME: keycloak
  KC_DB_PASSWORD: ${KC_DB_PASSWORD:?defina KC_DB_PASSWORD no .env}

  KC_HOSTNAME: http://localhost:8180
  KC_HTTP_ENABLED: "true"
  KC_HTTP_PORT: "8180"
  KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN_USER:-admin}
  KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PASSWORD:?defina KC_ADMIN_PASSWORD no .env}

x-rabbitmq-node: &rabbitmq-node
  image: rabbitmq:3.13-management
  restart: unless-stopped
  networks: [backend, edge]
  security_opt: ["no-new-privileges:true"]
  environment:
    RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-aisafe}
    RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    RABBITMQ_ERLANG_COOKIE: ${RABBITMQ_ERLANG_COOKIE:?defina RABBITMQ_ERLANG_COOKIE no .env}
  healthcheck:
    test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
    interval: 10s
    timeout: 10s
    retries: 18
    start_period: 40s

x-fo-env: &fo-env
  <<: *service-env
  RABBITMQ_ADDRESSES: rabbitmq-1:5671,rabbitmq-2:5671,rabbitmq-3:5671
  RABBITMQ_SSL: "true"
  RABBITMQ_USER: ${RABBITMQ_USER:-aisafe}
  RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}

x-keycloak-db-node: &keycloak-db-node
  image: bitnamilegacy/postgresql-repmgr:17.6.0
  restart: unless-stopped
  networks: [backend]
  security_opt: ["no-new-privileges:true"]
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U keycloak -d keycloak"]
    interval: 5s
    timeout: 5s
    retries: 30
    start_period: 20s

x-keycloak-db-env: &keycloak-db-env
  POSTGRESQL_POSTGRES_PASSWORD: ${KC_DB_ADMIN_PASSWORD:?defina KC_DB_ADMIN_PASSWORD no .env}
  POSTGRESQL_USERNAME: keycloak
  POSTGRESQL_PASSWORD: ${KC_DB_PASSWORD:?defina KC_DB_PASSWORD no .env}
  POSTGRESQL_DATABASE: keycloak
  REPMGR_PASSWORD: ${KC_REPMGR_PASSWORD:?defina KC_REPMGR_PASSWORD no .env}
  REPMGR_PRIMARY_HOST: keycloak-db-0
  REPMGR_PARTNER_NODES: keycloak-db-0,keycloak-db-1,keycloak-db-2
  REPMGR_USE_PGREWIND: "yes"

x-gateway: &gateway
  image: nginx:1.27-alpine
  restart: unless-stopped
  networks: [edge, backend]
  security_opt: ["no-new-privileges:true"]
  volumes:
    - ./docker/nginx.docker.conf:/etc/nginx/nginx.conf:ro
    - ./docker/certs/aisafe.pem:/etc/nginx/certs/aisafe.pem:ro
    - ./docker/certs/aisafe.key:/etc/nginx/certs/aisafe.key:ro
  depends_on:
    keycloak-1: {condition: service_started}
    keycloak-2: {condition: service_started}
    aircraft-1: {condition: service_healthy}
    aircraft-2: {condition: service_healthy}
    maintenance-1: {condition: service_healthy}
    maintenance-2: {condition: service_healthy}
    airports-routes-1: {condition: service_healthy}
    airports-routes-2: {condition: service_healthy}
    flight-operations-1: {condition: service_healthy}
    flight-operations-2: {condition: service_healthy}

services:
  keycloak-db-0:
    <<: *keycloak-db-node
    environment:
      <<: *keycloak-db-env
      REPMGR_NODE_NAME: keycloak-db-0
      REPMGR_NODE_NETWORK_NAME: keycloak-db-0
    volumes: [keycloak-db-0-data:/bitnami/postgresql]

  keycloak-db-1:
    <<: *keycloak-db-node
    environment:
      <<: *keycloak-db-env
      REPMGR_NODE_NAME: keycloak-db-1
      REPMGR_NODE_NETWORK_NAME: keycloak-db-1
    volumes: [keycloak-db-1-data:/bitnami/postgresql]

  keycloak-db-2:
    <<: *keycloak-db-node
    environment:
      <<: *keycloak-db-env
      REPMGR_NODE_NAME: keycloak-db-2
      REPMGR_NODE_NETWORK_NAME: keycloak-db-2
    volumes: [keycloak-db-2-data:/bitnami/postgresql]

  keycloak-1:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start", "--import-realm"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment: *keycloak-env
    networks:
      backend:
        aliases: [keycloak]
    volumes:
      - ./keycloak/aisafe-realm.json:/opt/keycloak/data/import/aisafe-realm.json:ro
    depends_on:
      keycloak-db-0: {condition: service_healthy}

  keycloak-2:
    image: quay.io/keycloak/keycloak:26.2.5
    command: ["start"]
    restart: unless-stopped
    security_opt: ["no-new-privileges:true"]
    environment: *keycloak-env
    networks:
      backend:
        aliases: [keycloak]
    depends_on:
      keycloak-db-0: {condition: service_healthy}
      keycloak-1: {condition: service_started}

  # ------------------------- Message broker (AMQP) -------------------------
  # Cluster of 3 RabbitMQ nodes + quorum queues: survives the loss of any 1 node.
  # Clients only use AMQPS (5671) and list the 3 nodes (failover on reconnect).
  rabbitmq-1:
    <<: *rabbitmq-node
    hostname: rabbitmq-1
    volumes:
      - rabbitmq-1-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/certs/aisafe.pem:/etc/rabbitmq/certs/aisafe.pem:ro
      - ./docker/certs/aisafe.key:/etc/rabbitmq/certs/aisafe.key:ro
    ports:
      - "127.0.0.1:15672:15672"     # management console only, on localhost

  rabbitmq-2:
    <<: *rabbitmq-node
    hostname: rabbitmq-2
    volumes:
      - rabbitmq-2-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/certs/aisafe.pem:/etc/rabbitmq/certs/aisafe.pem:ro
      - ./docker/certs/aisafe.key:/etc/rabbitmq/certs/aisafe.key:ro
    ports:
      - "127.0.0.1:15673:15672"     # management console only, on localhost

  rabbitmq-3:
    <<: *rabbitmq-node
    hostname: rabbitmq-3
    volumes:
      - rabbitmq-3-data:/var/lib/rabbitmq
      - ./rabbitmq/rabbitmq.conf:/etc/rabbitmq/rabbitmq.conf:ro
      - ./docker/certs/aisafe.pem:/etc/rabbitmq/certs/aisafe.pem:ro
      - ./docker/certs/aisafe.key:/etc/rabbitmq/certs/aisafe.key:ro
    ports:
      - "127.0.0.1:15674:15672"     # management console only, on localhost

  # One-shot: imports infrastructure/rabbitmq/definitions.json (exchanges, quorum queues,
  # bindings) so every queue exists BEFORE any service publishes. Tries the 3 nodes.
  rabbitmq-init:
    image: curlimages/curl:8.10.1
    restart: "no"
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-aisafe}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:?defina RABBITMQ_PASSWORD no .env}
    volumes:
      - ./rabbitmq/definitions.json:/defs/definitions.json:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      # O healthcheck do RabbitMQ (ping) fica OK antes da consola de gestao (15672) aceitar pedidos:
      # ate 40 tentativas de 3 s (~2 min) por no, para o primeiro arranque nao falhar.
      - |
        for n in 1 2 3; do
          if curl --fail --silent --show-error --retry 40 --retry-delay 3 --retry-all-errors \
               -u "$$RABBITMQ_USER:$$RABBITMQ_PASSWORD" -H "content-type: application/json" \
               -X POST --data @/defs/definitions.json "http://rabbitmq-$$n:15672/api/definitions"; then
            echo "definitions imported through rabbitmq-$$n"; exit 0
          fi
        done
        echo "could not import definitions"; exit 1
    depends_on:
      rabbitmq-1: {condition: service_healthy}
      rabbitmq-2: {condition: service_healthy}
      rabbitmq-3: {condition: service_healthy}

  # ------------------------- Aircraft -------------------------
  aircraft-1:
    <<: *service
    build:
      context: ../Services/Aircraft
    environment:
      <<: *service-env
      INSTANCE_ID: aircraft-1
      PEERS: https://aircraft-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      FLIGHTS_URLS: https://flight-operations-1:8443,https://flight-operations-2:8443
      FLIGHTS_GROUNDING_PATH: "/internal/scheduled-flights/aircraft/{registration}/grounding"
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443

  aircraft-2:
    <<: *service
    build:
      context: ../Services/Aircraft
    environment:
      <<: *service-env
      INSTANCE_ID: aircraft-2
      PEERS: https://aircraft-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      FLIGHTS_URLS: https://flight-operations-1:8443,https://flight-operations-2:8443
      FLIGHTS_GROUNDING_PATH: "/internal/scheduled-flights/aircraft/{registration}/grounding"
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443

  # ------------------------- Maintenance -------------------------
  maintenance-1:
    <<: *service
    build:
      context: ../Services/Maintenance
    environment:
      <<: *service-env
      INSTANCE_ID: maintenance-1
      PEERS: https://maintenance-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}

  maintenance-2:
    <<: *service
    build:
      context: ../Services/Maintenance
    environment:
      <<: *service-env
      INSTANCE_ID: maintenance-2
      PEERS: https://maintenance-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
    depends_on:
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}

  # ------------------------- Airports & Routes -------------------------
  # Database-per-Service: one PostgreSQL per Airports & Routes instance (write + read model).
  airports-db-1:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: airports
      POSTGRES_USER: airports
      POSTGRES_PASSWORD: ${AIRPORTS_DB_PASSWORD:?defina AIRPORTS_DB_PASSWORD no .env}
    volumes: [airports-db-1-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airports -d airports"]
      interval: 5s
      timeout: 5s
      retries: 20

  airports-db-2:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: airports
      POSTGRES_USER: airports
      POSTGRES_PASSWORD: ${AIRPORTS_DB_PASSWORD:?defina AIRPORTS_DB_PASSWORD no .env}
    volumes: [airports-db-2-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airports -d airports"]
      interval: 5s
      timeout: 5s
      retries: 20

  airports-routes-1:
    <<: *service
    build:
      context: ../Services/Airport e Routes/airports-routes-service
    environment:
      <<: *service-env
      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
      SERVER_SSL_KEY_ALIAS: aisafe-key
      PEER_URLS: https://airports-routes-2:8443
      PEER_NODE_ID: airports-routes-1
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5671,rabbitmq-2:5671,rabbitmq-3:5671
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-aisafe}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aisafe-mq}
      SPRING_DATASOURCE_URL: jdbc:postgresql://airports-db-1:5432/airports
      SPRING_DATASOURCE_USERNAME: airports
      SPRING_DATASOURCE_PASSWORD: ${AIRPORTS_DB_PASSWORD:?defina AIRPORTS_DB_PASSWORD no .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: none      # esquema gerido pelo Flyway
      SPRING_H2_CONSOLE_ENABLED: "false"
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: http://localhost:8180/realms/aisafe
      APP_SECURITY_JWT_ACCEPT_DEV_TOKENS: "true"
    depends_on:
      airports-db-1: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--silent", "--insecure", "--output", "/dev/null", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  airports-routes-2:
    <<: *service
    build:
      context: ../Services/Airport e Routes/airports-routes-service
    environment:
      <<: *service-env

      SERVER_PORT: "8443"
      SERVER_SSL_ENABLED: "true"
      SERVER_SSL_KEY_STORE: file:/certs/keystore.p12
      SERVER_SSL_KEY_STORE_PASSWORD: ${KEYSTORE_PASSWORD}
      SERVER_SSL_KEY_ALIAS: aisafe-key
      PEER_URLS: https://airports-routes-1:8443
      PEER_NODE_ID: airports-routes-2
      SPRING_RABBITMQ_ADDRESSES: rabbitmq-1:5671,rabbitmq-2:5671,rabbitmq-3:5671
      SPRING_RABBITMQ_SSL_ENABLED: "true"
      SPRING_RABBITMQ_USERNAME: ${RABBITMQ_USER:-aisafe}
      SPRING_RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-aisafe-mq}
      SPRING_DATASOURCE_URL: jdbc:postgresql://airports-db-2:5432/airports
      SPRING_DATASOURCE_USERNAME: airports
      SPRING_DATASOURCE_PASSWORD: ${AIRPORTS_DB_PASSWORD:?defina AIRPORTS_DB_PASSWORD no .env}
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: org.postgresql.Driver
      SPRING_JPA_DATABASE_PLATFORM: org.hibernate.dialect.PostgreSQLDialect
      SPRING_JPA_HIBERNATE_DDL_AUTO: none      # esquema gerido pelo Flyway
      SPRING_H2_CONSOLE_ENABLED: "false"
      APP_SECURITY_JWT_JWK_SET_URI: http://keycloak:8180/realms/aisafe/protocol/openid-connect/certs
      APP_SECURITY_JWT_ISSUER: http://localhost:8180/realms/aisafe
      APP_SECURITY_JWT_ACCEPT_DEV_TOKENS: "true"

    depends_on:
      airports-db-2: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "curl", "--silent", "--insecure", "--output", "/dev/null", "https://localhost:8443/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 40s

  # ------------------------- Flight Operations -------------------------
  # Database-per-Service: one PostgreSQL per FO replica (schemas fo_command + fo_query).
  fo-db-1:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: flightops
      POSTGRES_USER: flightops
      POSTGRES_PASSWORD: ${FO_DB_PASSWORD:?defina FO_DB_PASSWORD no .env (corra docker/gen-certs.ps1)}
    volumes: [fo-db-1-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightops -d flightops"]
      interval: 5s
      timeout: 5s
      retries: 20

  fo-db-2:
    image: postgres:16-alpine
    restart: unless-stopped
    networks: [backend]
    security_opt: ["no-new-privileges:true"]
    environment:
      POSTGRES_DB: flightops
      POSTGRES_USER: flightops
      POSTGRES_PASSWORD: ${FO_DB_PASSWORD:?defina FO_DB_PASSWORD no .env (corra docker/gen-certs.ps1)}
    volumes: [fo-db-2-data:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U flightops -d flightops"]
      interval: 5s
      timeout: 5s
      retries: 20

  flight-operations-1:
    <<: *service
    build:
      context: ../Services/Flighting Operations
    environment:
      <<: *fo-env
      INSTANCE_ID: flight-operations-1
      PEERS: https://flight-operations-2:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443
      DB_URL: jdbc:postgresql://fo-db-1:5432/flightops
      DB_USER: flightops
      DB_PASSWORD: ${FO_DB_PASSWORD}
    depends_on:
      fo-db-1: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}
      airports-routes-1: {condition: service_healthy}
      airports-routes-2: {condition: service_healthy}

  flight-operations-2:
    <<: *service
    build:
      context: ../Services/Flighting Operations
    environment:
      <<: *fo-env
      INSTANCE_ID: flight-operations-2
      PEERS: https://flight-operations-1:8443
      API_KEY: ${API_KEY:?defina API_KEY no .env}
      ACCEPT_DEV_TOKENS: "false"
      AIRCRAFT_URLS: https://aircraft-1:8443,https://aircraft-2:8443
      ROUTES_URLS: https://airports-routes-1:8443,https://airports-routes-2:8443
      DB_URL: jdbc:postgresql://fo-db-2:5432/flightops
      DB_USER: flightops
      DB_PASSWORD: ${FO_DB_PASSWORD}
    depends_on:
      fo-db-2: {condition: service_healthy}
      rabbitmq-init: {condition: service_completed_successfully}
      aircraft-1: {condition: service_healthy}
      aircraft-2: {condition: service_healthy}
      airports-routes-1: {condition: service_healthy}
      airports-routes-2: {condition: service_healthy}

  # ------------------------- API Gateways (2 instancias identicas) -------------------------
  gateway-1:
    <<: *gateway
    ports:
      - "8443:8443"

  gateway-2:
    <<: *gateway
    ports:
      - "8444:8443"

networks:
  edge: {}
  backend:
    internal: true

volumes:
  keycloak-db-0-data: {}
  keycloak-db-1-data: {}
  keycloak-db-2-data: {}
  fo-db-1-data: {}
  fo-db-2-data: {}
  airports-db-1-data: {}
  airports-db-2-data: {}
  rabbitmq-1-data: {}
  rabbitmq-2-data: {}
  rabbitmq-3-data: {}
