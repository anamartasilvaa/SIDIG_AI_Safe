# =====================================================================
#  AISafe - API Gateway (NGINX) - versao DOCKER (docker-compose.secure.yml)
#  Duas gateways identicas (gateway-1 em :8443, gateway-2 em :8444): se uma cair, usa-se a outra
#
#   /realms/...                 -> Keycloak (2 nos em cluster, login e emissao de tokens JWT)
#   /api/scheduled-flights...   -> Flight Operations (2 replicas, round-robin)
#   /api/airports, /api/routes  -> Airports & Routes (2 replicas, round-robin)
#   /api/aircraft...            -> Aircraft (2 replicas, round-robin)
#   /api/maintenance            -> Maintenance (2 replicas, round-robin)
#   /internal/, /actuator/, /h2-console/ -> BLOQUEADOS (so entre servicos)
#
#  A gateway NAO valida o JWT: reencaminha o header Authorization e cada
#  servico valida a assinatura com a chave publica do Keycloak (defesa em profundidade).
# =====================================================================

worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/json;
    server_tokens off;                      # nao revela a versao do NGINX

    # Log de acesso: pedido, codigo, replica que respondeu e tempo
    log_format gateway '$time_local $remote_addr "$request" $status '
                       '-> $upstream_addr ($upstream_status) $request_time s id=$request_id';
    access_log  /dev/stdout  gateway;
    error_log   /dev/stderr  warn;

    # Rate limiting por IP de cliente (protecao contra abuso / DoS)
    limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;
    limit_req_status 429;

    # ------------------------------------------------------------------
    # Replicas de cada servico = containers da rede interna 'backend'.
    # O NGINX resolve estes nomes ao arrancar (por isso o compose so o inicia
    # depois de todos os servicos estarem saudaveis).
    # Replica que falha -> fica fora 10 s e o pedido segue para a seguinte
    # ------------------------------------------------------------------
    upstream flight_operations {
        server flight-operations-1:8443 max_fails=1 fail_timeout=10s;
        server flight-operations-2:8443 max_fails=1 fail_timeout=10s;
    }

    upstream airports_routes {
        server airports-routes-1:8443 max_fails=1 fail_timeout=10s;
        server airports-routes-2:8443 max_fails=1 fail_timeout=10s;
    }

    upstream aircraft {
        server aircraft-1:8443 max_fails=1 fail_timeout=10s;
        server aircraft-2:8443 max_fails=1 fail_timeout=10s;
    }

    upstream maintenance {
        server maintenance-1:8443 max_fails=1 fail_timeout=10s;
        server maintenance-2:8443 max_fails=1 fail_timeout=10s;
    }

    upstream keycloak {
        server keycloak-1:8180 max_fails=1 fail_timeout=10s;
        server keycloak-2:8180 max_fails=1 fail_timeout=10s;
    }

    server {
        listen       8443 ssl;
        server_name  localhost;

        # ---------------- HTTPS cliente -> gateway ----------------
        ssl_certificate      /etc/nginx/certs/aisafe.pem;
        ssl_certificate_key  /etc/nginx/certs/aisafe.key;
        ssl_protocols        TLSv1.2 TLSv1.3;

        # ---------------- HTTPS gateway -> servicos ----------------
        # So confia no certificado do grupo (nao aceita outro servidor a fazer-se passar pelo servico)
        proxy_ssl_trusted_certificate  /etc/nginx/certs/aisafe.pem;
        proxy_ssl_verify               on;
        proxy_ssl_name                 localhost;
        proxy_ssl_server_name          on;
        proxy_ssl_session_reuse        on;

        # ---------------- Tolerancia a falhas ----------------
        proxy_connect_timeout     1s;
        proxy_read_timeout        10s;
        proxy_next_upstream       error timeout http_502 http_503 http_504 non_idempotent;    # replica em baixo -> tenta a seguinte
        proxy_next_upstream_tries 3;

        # ---------------- Headers para os servicos ----------------
        # (o Authorization: Bearer <token> passa automaticamente)
        proxy_set_header  Host               $http_host;    # inclui a porta (links HATEOAS com :8443)
        proxy_set_header  X-Real-IP          $remote_addr;
        proxy_set_header  X-Forwarded-For    $proxy_add_x_forwarded_for;
        proxy_set_header  X-Forwarded-Proto  https;
        proxy_set_header  X-Request-Id       $request_id;

        # Mostra ao cliente que replica respondeu (util para demonstrar o round-robin)
        add_header  X-Served-By   $upstream_addr always;
        add_header  X-Request-Id  $request_id    always;

        # ---------------- Erros gerados pela propria gateway ----------------
        error_page 429 = @too_many_requests;
        error_page 502 504 = @service_unavailable;

        location @too_many_requests {
            default_type application/problem+json;
            return 429 '{"type":"about:blank","title":"Too Many Requests","status":429,"detail":"Rate limit exceeded at the API gateway. Try again later."}';
        }

        location @service_unavailable {
            default_type application/problem+json;
            return 503 '{"type":"about:blank","title":"Service Unavailable","status":503,"detail":"No replica of the requested service is available."}';
        }

        # ---------------- Bloqueados: so entre servicos ----------------
        location ^~ /internal/ {
            default_type application/problem+json;
            return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"Internal endpoints are not exposed by the API gateway."}';
        }

        location ^~ /actuator/ {
            default_type application/problem+json;
            return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"Management endpoints are not exposed by the API gateway."}';
        }

        location ^~ /h2-console/ {
            default_type application/problem+json;
            return 403 '{"type":"about:blank","title":"Forbidden","status":403,"detail":"Database console is not exposed by the API gateway."}';
        }

        # ---------------- Keycloak (login / tokens) ----------------
        # Host fixo = localhost:8180 para o Keycloak continuar a emitir tokens com
        # iss = http://localhost:8180/realms/aisafe (o issuer que os servicos validam)
        location /realms/ {
            limit_req zone=api burst=20 nodelay;
            proxy_pass        http://keycloak;
            proxy_set_header  Host             localhost:8180;
            proxy_set_header  X-Real-IP        $remote_addr;
            proxy_set_header  X-Forwarded-For  $proxy_add_x_forwarded_for;
        }

        # ---------------- Flight Operations ----------------
        location /api/scheduled-flights {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://flight_operations;
        }
        location /api/v2/unicorns {
                    limit_req zone=api burst=20 nodelay;
                    proxy_pass https://flight_operations;
                }

        # ---------------- Airports & Routes ----------------
        location ~ ^/api/(airports|routes) {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://airports_routes;
        }

        # ---------------- Aircraft (/api/aircraft e /api/aircraft-models) ----------------
        location /api/aircraft {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://aircraft;
        }

        # ---------------- Maintenance ----------------
        location /api/maintenance {
            limit_req zone=api burst=20 nodelay;
            proxy_pass https://maintenance;
        }

        # ---------------- Tudo o resto: nao existe ----------------
        location / {
            default_type application/problem+json;
            return 404 '{"type":"about:blank","title":"Not Found","status":404,"detail":"No service is mapped to this path."}';
        }
    }
}
